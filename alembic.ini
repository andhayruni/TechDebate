# Only for writing a new migration. techdebate runs the migrations itself whenever it opens the database.
# Against a database at the newest migration (TECHDEBATE_DB_PATH):
#   uv run alembic revision --autogenerate --rev-id <next number, e.g. 0002> -m "<what changes>"

[alembic]
script_location = %(here)s/src/techdebate/store/migrations
file_template = %%(rev)s_%%(slug)s
